/* --- 牌名 --- */
const TAROT_NAMES = (() => {
    const major = ["愚者","魔術師","女祭司","皇后","皇帝","教皇","戀人","戰車","力量","隱者","命運之輪","正義","吊人","死神","節制","惡魔","高塔","星星","月亮","太陽","審判","世界"];
    const ranks = ["王牌","二","三","四","五","六","七","八","九","十","侍者","騎士","皇后","國王"];
    const all = [...major];
    ["權杖","聖杯","寶劍","錢幣"].forEach(s => ranks.forEach(r => all.push(s + r)));
    return all;
})();
const LENORMAND_NAMES = ["騎士","幸運草","船","房子","樹","烏雲","蛇","棺材","花束","鐮刀","鞭子","鳥","小孩","狐狸","熊","星星","鸛鳥","狗","塔","花園","山","岔路","老鼠","心","戒指","書","信","男人","女人","百合","太陽","月亮","鑰匙","魚","錨","十字架"];
/* 大天使神諭卡牌名：依圖檔順序填入即可；留空則顯示「大天使 1、大天使 2…」 */
const ARCHANGEL_NAMES = [];

/* --- 牌組定義 ---
   folder：圖片資料夾　start：第一張圖的編號（塔羅從 00，其餘從 01）　ext：圖片副檔名
   reversible：是否有正逆位 */
const SECTIONS = [
    { title: "偉特塔羅牌", decks: [{
        id: "tarot", label: "", folder: "images/tarot/", ext: ".jpg", start: 0, pad: 2,
        count: 78, names: TAROT_NAMES, reversible: true,
        spreads: [SP.universal, SP.time, SP.choose2] }] },
    { title: "雷諾曼", decks: [{
        id: "lenormand", label: "", folder: "images/lenormand/", ext: ".jpg", start: 1, pad: 2,
        count: 36, names: LENORMAND_NAMES, reversible: false,
        spreads: [SP.single, SP.three, SP.universal] }] },
    { title: "天使神諭卡", decks: [{
        id: "archangel", label: "大天使神諭卡", folder: "images/archangel/", ext: ".jpg", start: 1, pad: 2,
        count: 45, names: ARCHANGEL_NAMES, fallbackName: "大天使", reversible: false,
        spreads: [SP.single] }] }
];


/* =====================================================
   二、工具
===================================================== */
const $ = id => document.getElementById(id);
const views = { select: $("viewSelect"), draw: $("viewDraw") };

function show(name) {
    Object.entries(views).forEach(([k, el]) => el.hidden = (k !== name));
    window.scrollTo({ top: 0, behavior: "smooth" });
}
function rand(max) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / max) * max;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
}
function shuffled(n) {
    const a = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}
function cardName(deck, i) {
    return (deck.names && deck.names[i]) || (deck.fallbackName ? deck.fallbackName + " " + (i + 1) : "第 " + (i + 1) + " 號");
}
function imgPath(deck, i) { return deck.folder + String(deck.start + i).padStart(deck.pad, "0") + deck.ext; }
const slotCount = sp => sp.labels.length;
const isMain = (sp, i) => !!(sp.main && sp.main.includes(i));


/* =====================================================
   三、第一頁：提醒＋選擇牌種與牌陣
===================================================== */
function buildSelect() {
    $("noticeList").innerHTML = NOTICES.map(t => "<li>" + t + "</li>").join("");
    const box = $("selectArea");
    box.innerHTML = "";
    SECTIONS.forEach(sec => sec.decks.forEach(deck => {
        const row = document.createElement("div");
        row.className = "deck-row";
        row.innerHTML = '<div class="deck-name">' + sec.title + (deck.label ? "<small>" + deck.label + "</small>" : "") + "</div>";
        const btns = document.createElement("div");
        btns.className = "spread-btns";
        deck.spreads.forEach(sp => {
            const b = document.createElement("button");
            b.className = "spread-btn";
            b.innerHTML = sp.name + "<small>" + slotCount(sp) + " 張</small>";
            b.onclick = () => beginSpread(sec, deck, sp);
            btns.appendChild(b);
        });
        row.appendChild(btns);
        box.appendChild(row);
    }));
}


/* =====================================================
   四、第二頁：點選牌框抽牌
===================================================== */
let cur = null;

function beginSpread(sec, deck, sp) {
    cur = { sec, deck, sp, order: [], picks: [], drawn: 0, finished: false, busy: false };
    startDraw();
}

function startDraw() {
    const { deck, sp, sec } = cur;
    cur.order = shuffled(deck.count);                 // 先洗牌，之後每點一次牌框就依序翻出一張
    cur.picks = new Array(slotCount(sp)).fill(null);  // 依牌位存放
    cur.drawn = 0; cur.finished = false; cur.busy = true;

    $("crumb").textContent = sec.title + (deck.label ? "・" + deck.label : "");
    $("drawTitle").textContent = sp.name;
    $("summary").hidden = true;

    // 牌背圖（有放 back 圖檔就使用，沒有則用預設花紋）
    const root = views.draw;
    root.style.removeProperty("--back-img");
    const t = new Image(), url = deck.folder + "back" + deck.ext;
    t.onload = () => root.style.setProperty("--back-img", 'url("' + url + '")');
    t.src = url;

    renderSlots(-1);
    show("draw");

    $("progress").textContent = "洗牌中⋯⋯請專注在你的問題上。";
    $("spread").classList.add("shuffling");
    setTimeout(() => { $("spread").classList.remove("shuffling"); cur.busy = false; updateProgress(); }, 1300);
}

function layoutRows() {
    const { sp } = cur;
    if (sp.layout) return sp.layout;
    const n = slotCount(sp), per = sp.perRow || 4, idx = Array.from({ length: n }, (_, i) => i), rows = [];
    for (let i = 0; i < n; i += per) rows.push(idx.slice(i, i + per));
    return rows;
}

function buildFront(deck, card) {
    const front = document.createElement("div");
    front.className = "face front" + (card.reversed ? " reversed" : "");
    const img = new Image();
    img.src = imgPath(deck, card.index);
    img.alt = card.name;
    img.onerror = () => { front.innerHTML = '<div class="fallback">' + card.name + "</div>"; };
    front.appendChild(img);
    return front;
}

function nameHtml(deck, card) {
    let h = card.name;
    if (deck.reversible) h += '<br><span class="pos ' + (card.reversed ? "rev" : "") + '">' + (card.reversed ? "逆位" : "正位") + "</span>";
    return h;
}

function nextEmpty() { return cur.picks.findIndex(p => !p); }

function renderSlots(animateIdx) {
    const { deck, sp, picks } = cur;
    const spread = $("spread");
    spread.innerHTML = "";
    spread.classList.toggle("one", slotCount(sp) === 1);
    const next = nextEmpty();

    layoutRows().forEach(row => {
        const rowEl = document.createElement("div");
        rowEl.className = "spread-row" + (row.some(i => isMain(sp, i)) && row.length > 1 ? " has-main" : "");
        row.forEach(i => {
            const slot = document.createElement("div");
            slot.className = "slot" + (isMain(sp, i) ? " main" : "");
            slot.innerHTML = '<div class="slot-label">' + sp.labels[i] + "</div><div class='slot-name'></div>";
            const nameEl = slot.querySelector(".slot-name");

            if (picks[i]) {
                const wrap = document.createElement("div");
                wrap.className = "card-wrap";
                const card = document.createElement("div");
                card.className = "card" + (i === animateIdx ? "" : " flipped");
                card.appendChild(buildFront(deck, picks[i]));
                const back = document.createElement("div");
                back.className = "face back";
                card.appendChild(back);
                wrap.appendChild(card);
                slot.insertBefore(wrap, nameEl);
                nameEl.innerHTML = nameHtml(deck, picks[i]);
                if (i === animateIdx) requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add("flipped")));
            } else {
                // 空的牌框：點一下就抽牌
                const btn = document.createElement("button");
                btn.className = "card-wrap empty" + (i === next ? " next" : "");
                btn.textContent = "點此抽牌";
                btn.setAttribute("aria-label", "抽牌：" + sp.labels[i]);
                btn.onclick = () => drawSlot(i);
                slot.insertBefore(btn, nameEl);
            }
            rowEl.appendChild(slot);
        });
        spread.appendChild(rowEl);
    });
}

function updateProgress() {
    if (cur.finished) { $("progress").textContent = ""; return; }
    const n = slotCount(cur.sp), next = nextEmpty();
    $("progress").innerHTML = "點選牌框抽牌　（<b>" + cur.drawn + " / " + n + "</b>）　下一張：<b>" + cur.sp.labels[next] + "</b>";
}

function drawSlot(i) {
    if (cur.busy || cur.finished || cur.picks[i]) return;
    const { deck, sp } = cur;
    const index = cur.order[cur.drawn++];             // 從洗好的牌依序取一張
    cur.picks[i] = { index, name: cardName(deck, index), reversed: deck.reversible ? rand(2) === 1 : false };
    renderSlots(i);
    if (cur.drawn >= slotCount(sp)) finish(); else updateProgress();
}

function finish() {
    cur.finished = true;
    $("progress").textContent = "";
    const { deck, sp, picks } = cur;
    $("summaryList").innerHTML = picks.map((c, i) =>
        "<li><span>" + sp.labels[i] + "</span><span>" + c.name + (deck.reversible ? "（" + (c.reversed ? "逆位" : "正位") + "）" : "") + "</span></li>"
    ).join("");
    $("summary").hidden = false;
    setTimeout(() => $("summary").scrollIntoView({ behavior: "smooth", block: "center" }), 900);
}

$("drawBack").onclick = () => show("select");
$("redrawBtn").onclick = () => startDraw();


/* =====================================================
   五、分享：複製文字 / 傳到 LINE / 結果圖片 / 預約按鈕
===================================================== */
function resultText() {
    const { deck, sp, picks, sec } = cur;
    return [
        "【靖靖塔羅 線上抽牌】",
        sec.title + (deck.label ? "・" + deck.label : "") + "／" + sp.name,
        "",
        ...picks.map((c, i) => sp.labels[i] + "：" + c.name + (deck.reversible ? "（" + (c.reversed ? "逆位" : "正位") + "）" : ""))
    ].join("\n");
}

function openModal(html) { $("modalBody").innerHTML = html; $("modal").hidden = false; }
$("modalClose").onclick = () => $("modal").hidden = true;
$("modal").onclick = e => { if (e.target === $("modal")) $("modal").hidden = true; };

async function copyText(text) {
    try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) {}
    // 備用方式（LINE / IG 內建瀏覽器常常不支援上面的方法）
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, 99999);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
}

$("copyBtn").onclick = async () => {
    const text = resultText();
    if (await copyText(text)) {
        $("copyBtn").textContent = "已複製 ✓";
        setTimeout(() => $("copyBtn").textContent = "複製文字", 1800);
    } else {
        openModal('<div class="tip">此瀏覽器無法自動複製，請長按下方文字，選「全選」後再複製。</div><textarea id="manualText" readonly></textarea>');
        const ta = $("manualText"); ta.value = text; ta.focus(); ta.select();
    }
};
$("lineShareBtn").onclick = () => window.open("https://line.me/R/msg/text/?" + encodeURIComponent(resultText()), "_blank");

/* ---- 產生結果圖片 ---- */
function loadImg(src) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
function roundPath(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

async function buildResultCanvas() {
    const { deck, sp, picks, sec } = cur;
    const W = 1080, PAD = 60, GAP = 30, FONT = '"Noto Sans TC","Microsoft JhengHei",sans-serif';
    const rows = layoutRows();
    const imgs = await Promise.all(picks.map(c => loadImg(imgPath(deck, c.index))));

    const plan = rows.map(row => {
        const unit = Math.min(row.length === 1 ? 300 : 220, (W - 2 * PAD - (row.length - 1) * GAP) / row.length);
        return { row, unit, h: unit * 12 / 7, off: row.some(i => isMain(sp, i)) && row.length > 1 ? 50 : 0 };
    });
    const HEAD = 230, LABEL = 46, NAME = 100, ROWGAP = 20, FOOT = 110;
    const H = HEAD + plan.reduce((a, p) => a + LABEL + p.h + NAME + ROWGAP + p.off, 0) + FOOT;

    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#f7f3ed"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#625d57"; ctx.font = "500 50px " + FONT; ctx.fillText("靖靖塔羅", W / 2, 95);
    ctx.fillStyle = "#9b938a"; ctx.font = "24px " + FONT; ctx.fillText("JingJing Tarot", W / 2, 135);
    ctx.fillStyle = "#7d6c55"; ctx.font = "30px " + FONT;
    ctx.fillText(sec.title + (deck.label ? "・" + deck.label : "") + "｜" + sp.name, W / 2, 190);

    let y = HEAD;
    plan.forEach(p => {
        const w = p.unit, h = p.h;
        const total = w * p.row.length + GAP * (p.row.length - 1);
        let x = (W - total) / 2;
        p.row.forEach(i => {
            const c = picks[i], im = imgs[i];
            const yo = isMain(sp, i) ? 0 : p.off;
            ctx.fillStyle = isMain(sp, i) ? "#a1824a" : "#857c73";
            ctx.font = (isMain(sp, i) ? "500 30px " : "26px ") + FONT;
            ctx.fillText(sp.labels[i], x + w / 2, y + yo + 30);

            const cy = y + yo + LABEL;
            ctx.save();
            roundPath(ctx, x, cy, w, h, 14); ctx.clip();
            if (im) {
                ctx.translate(x + w / 2, cy + h / 2);
                if (c.reversed) ctx.rotate(Math.PI);
                const ir = im.width / im.height, br = w / h;
                let dw = w, dh = h;
                if (ir > br) dw = h * ir; else dh = w / ir;
                ctx.drawImage(im, -dw / 2, -dh / 2, dw, dh);
            } else {
                ctx.fillStyle = "#fffdf9"; ctx.fillRect(x, cy, w, h);
                ctx.fillStyle = "#6d665f"; ctx.font = "26px " + FONT; ctx.fillText(c.name, x + w / 2, cy + h / 2);
            }
            ctx.restore();
            ctx.strokeStyle = isMain(sp, i) ? "#c4a86b" : "#d9cfc3";
            ctx.lineWidth = isMain(sp, i) ? 4 : 2;
            roundPath(ctx, x, cy, w, h, 14); ctx.stroke();

            ctx.fillStyle = "#68615a"; ctx.font = "28px " + FONT; ctx.fillText(c.name, x + w / 2, cy + h + 42);
            if (deck.reversible) {
                ctx.fillStyle = c.reversed ? "#94644d" : "#8d7d6d"; ctx.font = "24px " + FONT;
                ctx.fillText(c.reversed ? "逆位" : "正位", x + w / 2, cy + h + 80);
            }
            x += w + GAP;
        });
        y += LABEL + p.h + NAME + ROWGAP + p.off;
    });

    ctx.fillStyle = "#9c948b"; ctx.font = "22px " + FONT;
    ctx.fillText(new Date().toLocaleDateString("zh-TW") + "　｜　牌卡不是替你決定，而是陪你看見。", W / 2, H - 50);
    return cv;
}

$("imgBtn").onclick = async () => {
    const btn = $("imgBtn");
    btn.disabled = true; btn.textContent = "圖片產生中⋯";
    try {
        const cv = await buildResultCanvas();
        const dataUrl = cv.toDataURL("image/png");
        const blob = await new Promise(r => cv.toBlob(r, "image/png"));
        const file = new File([blob], "jingjing-tarot.png", { type: "image/png" });
        const canShare = navigator.canShare && navigator.canShare({ files: [file] });
        openModal(
            '<img src="' + dataUrl + '" alt="抽牌結果">' +
            '<div class="tip">手機請長按圖片儲存，再到 LINE 或 IG 傳送。</div>' +
            '<div class="btns">' + (canShare ? '<button class="btn" id="shareImgBtn">分享圖片</button>' : "") +
            '<a class="btn ghost" href="' + dataUrl + '" download="jingjing-tarot.png">下載圖片</a></div>'
        );
        if (canShare) $("shareImgBtn").onclick = () => navigator.share({ files: [file], title: "靖靖塔羅 抽牌結果" }).catch(() => {});
    } catch (e) {
        alert("圖片產生失敗，請改用「複製文字」。");
    }
    btn.disabled = false; btn.textContent = "儲存／分享圖片";
};

/* ---- 預約按鈕（LINE / IG） ---- */
(function () {
    const box = $("bookBtns");
    if (LINE_URL) box.insertAdjacentHTML("beforeend", '<a class="btn" href="' + LINE_URL + '" target="_blank" rel="noopener noreferrer">LINE 預約解讀</a>');
    if (IG_URL)   box.insertAdjacentHTML("beforeend", '<a class="btn" href="' + IG_URL + '" target="_blank" rel="noopener noreferrer">IG 私訊預約</a>');
})();

buildSelect();
show("select");
</script>

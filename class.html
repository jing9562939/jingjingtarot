<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程訊息・擺攤行事曆｜靖靖塔羅 JingJing Tarot</title>
    <meta name="description" content="靖靖塔羅的課程與擺攤行事曆，查看最新的塔羅課程、市集與活動日期。">
    <link rel="stylesheet" href="style.css">

    <style>
        /* ===== 行事曆頁面專用樣式 ===== */
        .cal-wrap { max-width: 900px; margin: auto; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter {
            padding: 7px 18px; border-radius: 30px; font-size: 13px; font-family: inherit; cursor: pointer;
            border: 1px solid #d9cfc3; background: rgba(255,253,249,0.8); color: #77716a; transition: 0.25s;
        }
        .filter:hover { background: #eee6dc; }
        .filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .legend { display: flex; gap: 14px; font-size: 13px; color: #8d857d; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        .dot-market { background: #d9a273; }
        .dot-class  { background: #8fb086; }

        .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .cal-head h2 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: 2px; color: #665f58; }
        .cal-nav { display: flex; gap: 8px; }
        .cal-btn {
            min-width: 40px; height: 36px; padding: 0 14px; white-space: nowrap; border-radius: 30px; font-size: 14px; font-family: inherit; cursor: pointer;
            border: 1px solid #d9cfc3; background: rgba(255,253,249,0.9); color: #6d665f; transition: 0.25s;
        }
        .cal-btn:hover { background: #eee6dc; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
        .dow { text-align: center; font-size: 13px; color: var(--text-faint); padding: 6px 0; }
        .dow:first-child, .dow:last-child { color: #b08d7a; }

        .day {
            min-height: 96px; padding: 6px; display: flex; flex-direction: column; gap: 4px; text-align: left;
            background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            font-family: inherit; color: var(--text); cursor: pointer; transition: 0.2s;
        }
        .day:hover { border-color: #c9bba8; background: #fffdf9; }
        .day.empty { visibility: hidden; pointer-events: none; }
        .day.sel { border-color: #c4a86b; background: #fffdf9; box-shadow: 0 4px 14px rgba(160,130,70,0.18); }
        .num { font-size: 13px; color: #8d857d; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; }
        .day.today .num { background: var(--accent); color: #fff; }
        .chips { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .chip { font-size: 11.5px; line-height: 1.45; padding: 1px 6px; border-radius: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chip.market { background: #f0dccb; color: #8a5a3a; }
        .chip.class  { background: #dbe6d8; color: #4f6b4a; }
        .more { font-size: 11px; color: #a0988f; padding-left: 4px; }

        .month { margin-bottom: 38px; }
        .month-title { margin: 0 0 10px; font-size: 20px; font-weight: 400; letter-spacing: 2px; color: #7d6c55; }

        /* 選取日期的詳細資訊 */
        .detail { margin-top: 18px; scroll-margin-bottom: 20px; }
        .detail-hint { text-align: center; font-size: 14px; color: var(--text-faint); padding: 8px 0 18px; margin: 0; }
        .detail-date { font-size: 16px; color: #7d6c55; letter-spacing: 1px; margin-bottom: 10px; }

        .ev-card {
            background: rgba(255,253,249,0.95); border: 1px solid #e7ded4; border-radius: 16px;
            padding: 20px 22px; margin-bottom: 12px;
        }
        .tag { display: inline-block; padding: 1px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 6px; }
        .tag.market { background: #f0dccb; color: #8a5a3a; }
        .tag.class  { background: #dbe6d8; color: #4f6b4a; }
        .ev-card h3 { margin: 0 0 6px; font-size: 18px; font-weight: 500; color: #68615a; }
        .ev-meta { font-size: 14px; color: #8d857d; }
        .ev-note { font-size: 14px; color: #938a81; margin-top: 6px; }
        .ev-link {
            display: inline-block; margin-top: 12px; padding: 7px 20px; border-radius: 30px; font-size: 13px;
            background: var(--accent); color: #fff; transition: 0.3s;
        }
        .ev-link:hover { background: var(--accent-dark); }

        /* 近期行程 */
        .upcoming-section { background: var(--bg-sand-2); border-top: 1px solid #e8dfd5; }
        .up-list { max-width: 760px; margin: auto; }
        .up-item {
            display: flex; gap: 18px; align-items: center; width: 100%; text-align: left; font-family: inherit; color: inherit;
            background: rgba(255,253,249,0.92); border: 1px solid #e7ded4; border-radius: 14px;
            padding: 14px 20px; margin-bottom: 12px; cursor: pointer; transition: 0.25s;
        }
        .up-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-soft); }
        .up-date { min-width: 78px; text-align: center; border-right: 1px solid #e3dacf; padding-right: 16px; }
        .up-date b { display: block; font-size: 22px; font-weight: 500; color: #7d6c55; line-height: 1.2; }
        .up-date small { font-size: 12px; color: #a39a90; }
        .up-body h3 { margin: 0; font-size: 16px; font-weight: 500; color: #68615a; }
        .up-body p { margin: 2px 0 0; font-size: 13px; color: #938a81; }
        .empty-tip { text-align: center; color: var(--text-faint); font-size: 14px; }

        @media (max-width: 800px) {
            .day { min-height: 58px; padding: 4px; align-items: center; }
            .chips { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 3px; }
            .chip { font-size: 0; width: 7px; height: 7px; padding: 0; border-radius: 50%; }
            .chip.market { background: #d9a273; }
            .chip.class  { background: #8fb086; }
            .more { display: none; }
            .cal-head h2 { font-size: 17px; letter-spacing: 1px; }
            .cal-btn { padding: 0 10px; }
            .page-hero h1 { font-size: 26px; letter-spacing: 2px; }
            .cta h2 { font-size: 21px; letter-spacing: 1px; }
            .up-item { padding: 12px 14px; gap: 12px; }
            .up-date { min-width: 64px; padding-right: 12px; }
        }
    </style>
</head>

<body>

                    <button class="filter active" data-filter="all">全部</button>

<script>
/* =====================================================
   行程資料（只需要改這裡）
   ─────────────────────────────────────────────────
   start ：開始日期，格式 "YYYY-MM-DD"
   end   ：結束日期（單日活動可省略）
   type  ："market" = 擺攤・活動　"class" = 課程
   title ：標題
   time  ：時間（選填）　place：地點（選填）
   note  ：備註（選填）　link ：報名或詳情連結（選填）
   ※ 以下為「範例」，請換成你的真實行程，新增一筆就是複製一組 { } 加逗號。
===================================================== */
const EVENTS = [
    {
        start: "2026-11-07", end: "2026-11-08", type: "class",
        title: "進修",
        time: "10:00–18:00", place: "文化大學推廣教育",
        note: "歡迎來找靖靖聊聊，透過塔羅與水晶，陪你看看最近的自己。",
        link: ""
    },
    {
        start: "2026-11-21", end: "2026-11-22", type: "market",
        title: "擺攤",
        time: "12:00–18:00", place: "美麗島捷運站",
        note: "歡迎線上預約。",
        link: "https://cal.com/jing9562939/15min?user=jing9562939"
    },
    {
        start: "2026-12-19", end: "2026-12-20", type: "market",
        title: "擺攤",
        time: "12:00–18:00", place: "美麗島捷運站",
        note: "水晶DIY體驗 Part II。",
        link: "https://cal.com/jing9562939/15min?user=jing9562939"
    }
];


/* 月曆一次顯示兩個月，從這個月份開始（格式 "YYYY-MM"）。留空 "" 則從當月開始 */
const START_MONTH = "2026-11";


/* =====================================================
   以下為程式，一般不需要修改
===================================================== */
const $ = id => document.getElementById(id);
const TYPE_NAME = { market: "擺攤・活動", class: "課程" };
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];

const pad = n => String(n).padStart(2, "0");
const keyOf = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);
const parse = str => { const [y, m, d] = str.split("-").map(Number); return new Date(y, m - 1, d); };
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const todayDate = new Date();
const TODAY = keyOf(todayDate.getFullYear(), todayDate.getMonth(), todayDate.getDate());

let viewY = todayDate.getFullYear();
let viewM = todayDate.getMonth();
if (START_MONTH) { const [sy, sm] = START_MONTH.split("-").map(Number); viewY = sy; viewM = sm - 1; }
let selected = null;
let filter = "all";

// 整理成「每一天 → 行程」對照表（跨天活動會展開）
function buildMap() {
    const map = {};
    EVENTS.forEach((ev, idx) => {
        if (filter !== "all" && ev.type !== filter) return;
        const s = parse(ev.start), e = parse(ev.end || ev.start);
        for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
            const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
            (map[k] = map[k] || []).push({ ...ev, idx });
        }
    });
    return map;
}

function fmtRange(ev) {
    const s = parse(ev.start), e = parse(ev.end || ev.start);
    const f = d => (d.getMonth() + 1) + "/" + d.getDate() + "（" + WEEK[d.getDay()] + "）";
    return ev.end && ev.end !== ev.start ? f(s) + " – " + f(e) : f(s);
}

function monthHtml(y, m, map) {
    let html = '<section class="month"><h3 class="month-title">' + y + " 年 " + (m + 1) + " 月</h3>" +
               '<div class="cal-grid">' + WEEK.map(w => '<div class="dow">' + w + "</div>").join("");
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();

    for (let i = 0; i < first; i++) html += '<div class="day empty"></div>';

    for (let d = 1; d <= days; d++) {
        const k = keyOf(y, m, d);
        const list = map[k] || [];
        const cls = "day" + (k === TODAY ? " today" : "") + (k === selected ? " sel" : "");
        const chips = list.slice(0, 2).map(ev => '<div class="chip ' + ev.type + '">' + esc(ev.title) + "</div>").join("");
        const more = list.length > 2 ? '<div class="more">+' + (list.length - 2) + "</div>" : "";
        const label = (m + 1) + "月" + d + "日" + (list.length ? "，有 " + list.length + " 個行程" : "");
        html += '<button class="' + cls + '" data-key="' + k + '" aria-label="' + label + '">' +
                '<span class="num">' + d + '</span><div class="chips">' + chips + more + "</div></button>";
    }
    html += "</div>";
    // 選取的日期若在這個月，詳細資訊直接顯示在這個月下方
    if (selected && selected.slice(0, 7) === y + "-" + pad(m + 1)) html += detailHtml(map);
    return html + "</section>";
}

function renderCalendar() {
    const map = buildMap();
    const next = new Date(viewY, viewM + 1, 1);
    $("calTitle").textContent = viewY + " 年 " + (viewM + 1) + " 月 – " +
        (next.getFullYear() !== viewY ? next.getFullYear() + " 年 " : "") + (next.getMonth() + 1) + " 月";

    $("calGrid").innerHTML = monthHtml(viewY, viewM, map) + monthHtml(next.getFullYear(), next.getMonth(), map);
    $("hint").hidden = !!selected;

    $("calGrid").querySelectorAll(".day[data-key]").forEach(btn => {
        btn.onclick = () => {
            selected = (selected === btn.dataset.key) ? null : btn.dataset.key;
            renderCalendar();
            const det = document.querySelector(".detail");
            if (det) det.scrollIntoView({ behavior: "smooth", block: "nearest" });
        };
    });
}

function eventCard(ev) {
    const meta = [ev.time, ev.place].filter(Boolean).map(esc).join("　・　");
    return '<div class="ev-card"><span class="tag ' + ev.type + '">' + TYPE_NAME[ev.type] + "</span>" +
        "<h3>" + esc(ev.title) + "</h3>" +
        '<div class="ev-meta">📅 ' + fmtRange(ev) + (meta ? "　・　" + meta : "") + "</div>" +
        (ev.note ? '<div class="ev-note">' + esc(ev.note) + "</div>" : "") +
        (ev.link ? '<a class="ev-link" href="' + esc(ev.link) + '" target="_blank" rel="noopener noreferrer">報名／了解詳情</a>' : "") +
        "</div>";
}

function detailHtml(map) {
    const d = parse(selected);
    const title = (d.getMonth() + 1) + " 月 " + d.getDate() + " 日（星期" + WEEK[d.getDay()] + "）";
    const list = map[selected] || [];
    return '<div class="detail"><div class="detail-date">' + title + "</div>" +
        (list.length ? list.map(eventCard).join("") : '<div class="ev-card"><div class="ev-meta">這天沒有安排行程。</div></div>') +
        "</div>";
}

function renderUpcoming() {
    const list = EVENTS
        .filter(ev => (filter === "all" || ev.type === filter) && (ev.end || ev.start) >= TODAY)
        .sort((a, b) => a.start.localeCompare(b.start))
        .slice(0, 6);
    const box = $("upList");
    if (!list.length) { box.innerHTML = '<div class="empty-tip">近期行程陸續更新中，敬請期待。</div>'; return; }
    box.innerHTML = list.map(ev => {
        const s = parse(ev.start);
        const meta = [ev.time, ev.place].filter(Boolean).map(esc).join("・");
        return '<button class="up-item" data-start="' + ev.start + '">' +
            '<div class="up-date"><b>' + s.getDate() + "</b><small>" + (s.getMonth() + 1) + " 月・" + WEEK[s.getDay()] + "</small></div>" +
            '<div class="up-body"><span class="tag ' + ev.type + '">' + TYPE_NAME[ev.type] + "</span>" +
            "<h3>" + esc(ev.title) + "</h3>" + (meta ? "<p>" + meta + "</p>" : "") + "</div></button>";
    }).join("");
    box.querySelectorAll(".up-item").forEach(btn => {
        btn.onclick = () => {
            const d = parse(btn.dataset.start);
            const diff = (d.getFullYear() - viewY) * 12 + d.getMonth() - viewM;
            if (diff < 0 || diff > 1) { viewY = d.getFullYear(); viewM = d.getMonth(); }   // 不在目前兩個月內才換月份
            selected = btn.dataset.start;
            renderAll();
            const det = document.querySelector(".detail");
            if (det) det.scrollIntoView({ behavior: "smooth", block: "center" });
        };
    });
}

function renderAll() { renderCalendar(); renderUpcoming(); }

$("prevBtn").onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCalendar(); };
$("nextBtn").onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCalendar(); };
$("todayBtn").onclick = () => { viewY = todayDate.getFullYear(); viewM = todayDate.getMonth(); selected = TODAY; renderAll(); };
document.querySelectorAll(".filter").forEach(b => {
    b.onclick = () => {
        document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        filter = b.dataset.filter;
        renderAll();
    };
});

renderAll();
</script>

</body>

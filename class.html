/* 若 events.js 沒有上傳，在頁面上提示 */
window.addEventListener("DOMContentLoaded", function () {
    if (typeof EVENTS === "undefined") {
        document.getElementById("evList").innerHTML = '<div style="padding:16px;text-align:center;font-size:14px;color:#938a81;border:1px dashed #d9cfc3;border-radius:14px">找不到 events.js，請確認它已和網頁放在同一個資料夾並上傳。</div>';
    }
});
</script>

<script>
const $ = id => document.getElementById(id);
const BOOK_URL = "https://cal.com/jing9562939/15min?user=jing9562939";

let viewY, viewM, hashKey = null;
(function init() {
    const now = new Date();
    viewY = now.getFullYear(); viewM = now.getMonth();
    if (START_MONTH) { const [y, m] = START_MONTH.split("-").map(Number); viewY = y; viewM = m - 1; }

    // 從首頁「最新公告」點進來時，網址會帶日期，例如 class.html#2026-11-21
    const h = location.hash.slice(1);
    if (/^\d{4}-\d{2}-\d{2}$/.test(h)) {
        hashKey = h;
        const d = parseDate(h);
        const diff = (d.getFullYear() - viewY) * 12 + d.getMonth() - viewM;
        if (diff < 0 || diff > 1) { viewY = d.getFullYear(); viewM = d.getMonth(); }
    }
})();

function buildMap() {
    const map = {};
    EVENTS.forEach(ev => {
        const s = parseDate(ev.start), e = parseDate(ev.end || ev.start);
        for (let d = new Date(s); d <= e; d.setDate(d.getDate() + 1)) {
            const k = keyOf(d.getFullYear(), d.getMonth(), d.getDate());
            (map[k] = map[k] || []).push(ev);
        }
    });
    return map;
}

function monthHtml(y, m, map) {
    let html = '<div><h3 class="month-title">' + y + " 年 " + (m + 1) + " 月</h3>" +
               '<div class="cal-grid">' + WEEK.map(w => '<div class="dow">' + w + "</div>").join("");
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) html += '<div class="mday empty"></div>';
    for (let d = 1; d <= days; d++) {
        const k = keyOf(y, m, d), list = map[k] || [];
        const cls = "mday" + (list.length ? " " + list[0].type : "") + (k === todayKey ? " today" : "") + (k < todayKey ? " past" : "");
        const names = list.map(e => TYPE_NAME[e.type]).join("、");
        html += '<div class="' + cls + '" title="' + (names || "可線上預約") + '"><span>' + d + "</span>" +
                (list.length ? '<span class="t">' + esc(TYPE_NAME[list[0].type]) + (list.length > 1 ? " +" + (list.length - 1) : "") + "</span>" : "") + "</div>";
    }
    return html + "</div></div>";
}

function eventHtml(ev) {
    const s = parseDate(ev.start), head = headline(ev);
    const when = [ev.time, ev.place && ev.place !== head ? ev.place : ""].filter(Boolean).map(esc).join("・");
    return '<div class="ev" id="ev-' + ev.start + '">' +
        '<div class="ev-date"><b>' + s.getDate() + "</b><small>" + (s.getMonth() + 1) + " 月・" + WEEK[s.getDay()] + "</small></div>" +
        '<div class="ev-body"><h3><span class="tag ' + ev.type + '">' + TYPE_NAME[ev.type] + "</span><span>" + esc(head) + "</span></h3>" +
        "<p>" + fmtRange(ev) + (when ? "・" + when : "") + "</p>" +
        (ev.note ? "<p>" + esc(ev.note) + "</p>" : "") +
        (ev.link ? '<a class="ev-link" href="' + esc(ev.link) + '" target="_blank" rel="noopener noreferrer">了解詳情／預約 →</a>' : "") +
        "</div></div>";
}

function render() {
    const map = buildMap();
    const next = new Date(viewY, viewM + 1, 1);
    $("calPair").innerHTML = monthHtml(viewY, viewM, map) + monthHtml(next.getFullYear(), next.getMonth(), map);

    // 公告清單：顯示目前這兩個月內的行程
    const winStart = keyOf(viewY, viewM, 1);
    const winEnd = keyOf(next.getFullYear(), next.getMonth(), new Date(next.getFullYear(), next.getMonth() + 1, 0).getDate());
    $("rangeText").textContent = (viewM + 1) + " 月 – " + (next.getMonth() + 1) + " 月";
    const list = EVENTS.filter(ev => ev.start <= winEnd && (ev.end || ev.start) >= winStart)
                       .sort((a, b) => a.start.localeCompare(b.start));
    $("evList").innerHTML = list.length ? list.map(eventHtml).join("")
        : '<div class="ev-empty">這兩個月沒有公告行程，歡迎<a href="' + BOOK_URL + '" target="_blank" rel="noopener noreferrer">線上預約</a>。</div>';

    // 從首頁點進來：標示對應的行程
    if (hashKey) {
        const ev = list.find(e => e.start <= hashKey && (e.end || e.start) >= hashKey);
        const el = ev && document.getElementById("ev-" + ev.start);
        if (el) { el.classList.add("hl"); el.scrollIntoView({ block: "nearest" }); }
    }
}

$("prevBtn").onclick = () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } hashKey = null; render(); };
$("nextBtn").onclick = () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } hashKey = null; render(); };
render();
</script>

</body>
</html>
